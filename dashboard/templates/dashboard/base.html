<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}European Urban Planning Dashboard{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; }
        .main-content { min-height: calc(100vh - 76px); }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'dashboard_index' %}">
                🌍 European Urban Planning Dashboard
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link {% if request.resolver_match.url_name == 'dashboard_index' %}active{% endif %}" href="{% url 'dashboard_index' %}">Dashboard</a>
                <a class="nav-link {% if request.resolver_match.url_name == 'dashboard_analytics' %}active{% endif %}" href="{% url 'dashboard_analytics' %}">Analytics</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-light mt-5 py-3">
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-6"><small class="text-muted">European Urban Planning Dashboard - Week 6 Lab</small></div>
                <div class="col-md-6 text-end"><small class="text-muted">Built with Django, PostGIS, and Leaflet</small></div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS & Leaflet JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
