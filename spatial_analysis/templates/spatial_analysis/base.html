<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dublin Spatial Analysis{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand navbar-dark bg-dark">
        <div class="container-fluid px- d4">
            <span class="navbar-brand mb-0 h1"> Dublin City</span>
            <div class="navbar-nav ms-auto gap-3">
                <a class="nav-link text-white-50" href="/">Map</a>
                <a class="nav-link text-white" href="/spatial/dashboard/">Dashboard</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
